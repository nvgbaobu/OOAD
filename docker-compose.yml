# Chạy toàn bộ demo bằng Docker Desktop:  docker compose up -d --build
# Seed dữ liệu mẫu (lần đầu / muốn làm mới):  docker compose exec app npx prisma db seed
services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2025-latest
    container_name: qlbs-mssql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-QlbsSach@2026}"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  app:
    build: .
    container_name: qlbs-app
    depends_on:
      mssql:
        condition: service_healthy
    environment:
      DATABASE_URL: "sqlserver://mssql:1433;database=QuanLyBanSach;user=sa;password=${MSSQL_SA_PASSWORD:-QlbsSach@2026};encrypt=true;trustServerCertificate=true"
      DB_HOST: mssql
      DB_PORT: "1433"
      DB_NAME: QuanLyBanSach
      DB_USER: sa
      DB_PASSWORD: "${MSSQL_SA_PASSWORD:-QlbsSach@2026}"
      SESSION_SECRET: "${SESSION_SECRET:-doi-chuoi-nay-bang-openssl-rand-base64-32}"
      COOKIE_SECURE: "false"
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  mssql_data:
