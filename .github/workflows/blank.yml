name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: quan-ly-ban-sach   # code Next.js nằm trong thư mục con

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: quan-ly-ban-sach/package-lock.json

      - name: Cài thư viện
        run: npm ci

      - name: Sinh Prisma Client
        run: npx prisma generate
        if: hashFiles('quan-ly-ban-sach/prisma/schema.prisma') != ''

      - name: Kiểm tra lint
        run: npm run lint

      - name: Build
        run: npm run build
