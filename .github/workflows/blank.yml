name: CI

on:
  push:
    branches: [main]
  pull_request:

# Push mới lên cùng nhánh thì hủy lần chạy cũ đang dở
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    # Code Next.js nằm ngay ở gốc repo (không có thư mục con) → không cần working-directory.
    env:
      # prisma.config.ts đọc env("DATABASE_URL"): `prisma generate` chỉ cần biến tồn tại, KHÔNG kết nối CSDL.
      # Giá trị giả – CI không có SQL Server. (Biến thật nằm trong .env ở máy dev, không commit.)
      DATABASE_URL: "sqlserver://localhost:1433;database=QuanLyBanSach;user=sa;password={ci};trustServerCertificate=true"

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm

      - name: Cài thư viện
        run: npm ci

      - name: Sinh Prisma Client
        run: npx prisma generate

      - name: Kiểm tra lint
        run: npm run lint

      - name: Kiểm tra kiểu TypeScript
        # next typegen sinh kiểu cho PageProps/LayoutProps/RouteContext trước khi tsc kiểm tra
        run: |
          npx next typegen
          npx tsc --noEmit

      - name: Build
        run: npm run build
